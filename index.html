<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 13 - Atom Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Project 13</h1>
        <div class="status-bar">
            <div class="player-info player1 active">
                Player 1
                <span class="orb-count" id="p1-count">0</span>
            </div>
            <div class="status-message" id="status-message">Player 1's Turn</div>
             <div class="player-info player2">
                Player 2
                 <span class="orb-count" id="p2-count">0</span>
            </div>
        </div>
        <div class="board-container">
            <div id="game-board" class="game-board">
                <!-- Cells will be generated by JavaScript -->
            </div>
        </div>
        <button id="reset-button" class="reset-button">Reset Game</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
